name: football_tic_tac_toe
description: Goalverse - Nihai Futbol Oyun Evreni
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.20.2 <=0.20.3'
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1
  isar: 3.1.0+1
  isar_flutter_libs: 3.1.0+1
  path_provider: 2.1.5
  shared_preferences: 2.5.5
  go_router: 17.2.3
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  cloud_firestore: 6.10.0
  cloud_functions: 6.5.0
  firebase_analytics: 12.6.0
  firebase_crashlytics: 5.4.0
  firebase_remote_config: 6.7.0
  google_sign_in: 7.2.0
  sign_in_with_apple: 7.0.1
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0
  crypto: 3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  isar_generator: 3.1.0+1
  build_runner: 2.4.13
  freezed: 2.5.2
  json_serializable: 6.8.0
  mockito: 5.4.4
  riverpod_generator: 2.3.3
  custom_lint: 0.5.11
  riverpod_lint: 2.1.1

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/dataset/
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
          weight: 600
        - asset: assets/fonts/Sora.ttf
          weight: 700
        - asset: assets/fonts/Sora.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
          weight: 400
        - asset: assets/fonts/Manrope.ttf
          weight: 500
        - asset: assets/fonts/Manrope.ttf
          weight: 600
        - asset: assets/fonts/Manrope.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk.ttf
          weight: 700
